<div class="auth-shell">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="wc-logo lg justify-content-center">
        <i class="bi bi-heart-pulse-fill"></i> WeCareForYou
      </div>
      <p class="text-muted-2 mt-2 mb-0">Reset your password</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">Registered Email</label>
        <input id="email" type="email" class="form-control" formControlName="email"
               [class.is-invalid]="invalid('email')" placeholder="you@example.com" />
        @if (invalid('email')) {
        <div class="text-danger small mt-1">Enter a valid email address.</div>
        }
      </div>

      <div class="mb-2">
        <label class="form-label" for="newPassword">New Password</label>
        <input id="newPassword" type="password" class="form-control"
               formControlName="newPassword" [class.is-invalid]="invalid('newPassword')"
               placeholder="Create a new password" />
        <app-password-strength [password]="passwordValue" />
      </div>

      <div class="mb-3">
        <label class="form-label" for="confirmPassword">Confirm New Password</label>
        <input id="confirmPassword" type="password" class="form-control"
               formControlName="confirmPassword"
               [class.is-invalid]="form.errors?.['mismatch'] && form.get('confirmPassword')?.touched"
               placeholder="Re-enter new password" />
        @if (form.errors?.['mismatch'] && form.get('confirmPassword')?.touched) {
        <div class="text-danger small mt-1">Passwords do not match.</div>
        }
      </div>

      <button class="btn btn-primary w-100" type="submit" [disabled]="loading()">
        @if (loading()) {
        <span class="spinner-border spinner-border-sm me-2"></span> Updating…
        } @else { Reset Password }
      </button>
    </form>

    <p class="text-center text-muted-2 small mt-4 mb-0">
      Remembered it? <a routerLink="/login">Back to sign in</a>
    </p>
  </div>
</div>
