# =============================================================================
# WeCareForYou — MySQL stack. Lives inside server-sql/ and is run from here:
#
#   cd server-sql
#   docker compose up --build
#
#   UI  → http://localhost:4200
#   API → http://localhost:5000/api/health   (Express + Sequelize + MySQL)
#
# Build contexts are relative to THIS folder:
#   .          -> server-sql (API + seed image)
#   ../client  -> the Angular app (shared, unchanged)
# The default Mongo stack (root docker-compose.yml / server/) is untouched.
# Override the secret:  JWT_SECRET=xyz docker compose up
# =============================================================================

name: wecare-sql

services:
  db:
    image: mysql:8
    container_name: wecare-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: wecare
      MYSQL_DATABASE: wecareforyou
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pwecare", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot: creates tables + populates everything. Idempotent.
  seed-sql:
    build: .
    container_name: wecare-seed-sql
    command: ["npm", "run", "seed:all"]
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: wecareforyou
      DB_USER: root
      DB_PASSWORD: wecare
      DB_SYNC: "true"
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-please}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server-sql:
    build: .
    container_name: wecare-server-sql
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: wecareforyou
      DB_USER: root
      DB_PASSWORD: wecare
      DB_SYNC: "true"
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-please}
      JWT_EXPIRES_IN: 7d
      CLIENT_ORIGIN: http://localhost:4200
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      seed-sql:
        condition: service_completed_successfully

  client:
    build: ../client
    container_name: wecare-client-sql
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - server-sql

volumes:
  mysql-data:
