# =============================================================================
# WeCareForYou — full stack in one command:
#
#   docker compose up --build
#
# Then open:  http://localhost:4200   (UI)
#             http://localhost:5000/api/health   (API)
#
# No local Node or MongoDB install required. Data persists in a named volume.
# Override secrets via host env, e.g.:  JWT_SECRET=xyz docker compose up
# =============================================================================

services:
  mongo:
    image: mongo:7
    container_name: wecare-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot: populates catalogs + every specialization's doctors + patients.
  # Idempotent, so it is safe that this re-runs on every `up`.
  seed:
    build: ./server
    container_name: wecare-seed
    command: ["npm", "run", "seed:all"]
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/wecareforyou
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-please}
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  server:
    build: ./server
    container_name: wecare-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/wecareforyou
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-please}
      JWT_EXPIRES_IN: 7d
      CLIENT_ORIGIN: http://localhost:4200
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  client:
    build: ./client
    container_name: wecare-client
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - server

volumes:
  mongo-data:
